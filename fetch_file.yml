---
- name: Find a named file on Windows hosts and copy it to the control node
  hosts: windows
  vars:
    search_path: 'C:\Users\Administrator'
    dest_dir: "{{ lookup('env', 'HOME') }}/fetched_files"
  tasks:
    - name: Fail when file_name is not provided
      ansible.builtin.fail:
        msg: "Pass the file name, for example: -e file_name=secret.txt"
      when: file_name is not defined

    - name: Search for the file
      ansible.windows.win_find:
        paths: "{{ search_path }}"
        patterns: "{{ file_name }}"
        recurse: true
      register: found
      no_log: true

    - name: Fail when the file was not found
      ansible.builtin.fail:
        msg: "'{{ file_name }}' not found under {{ search_path }} on {{ inventory_hostname }}"
      when: found.matched | int == 0

    - name: Fetch the file to the control node
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ dest_dir }}/{{ inventory_hostname }}/"
      loop: "{{ found.files }}"
      loop_control:
        label: "{{ item.path }}"
