---
- name: Install Notepad++
  chocolatey.chocolatey.win_chocolatey:
    name: notepadplusplus
    state: present

# The GoogleChrome package pins the SHA256 of a specific MSI build, but the
# Google download link always serves the newest build, so the checksum
# routinely mismatches. The MSI is Authenticode-signed by Google, so the
# checksum check is disabled here to keep the install working.
- name: Install Google Chrome
  chocolatey.chocolatey.win_chocolatey:
    name: googlechrome
    state: present
    ignore_checksums: true
